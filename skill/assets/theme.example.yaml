# ============================================================
# 世界观主题模板（可选）
#
# 用途：把技术概念换成一套「故事化」的说法，让课程有统一的叙事外壳。
# 用法：course.yaml 里设置
#         theme:
#           mode: custom
#           file: theme.yaml
#
# 注意：
#   1. 这只影响**讲稿的修辞**，不影响术语本身。章节标题仍建议用技术名
#      （观众看导航是为了知道「讲到哪」，不是猜谜）。
#   2. 不要为了包装牺牲清晰度。一个概念如果包装之后要额外解释一句，
#      就不要包装它。
#   3. 下面是「仙侠」示例，你可以整段替换成武侠、科幻、游戏、厨房……
#      或者干脆不用（course.yaml 里 theme.mode: plain）。
# ============================================================

name: "仙侠示例主题"

# 对读者的称呼
audience: "道友"
# 自称
self: "我"

# 术语映射：左边是技术概念，右边是包装说法
terms:
  "AI 工具使用": "引气入体"
  "AI 原理理解": "内功心法"
  "模型训练": "炼丹"
  "训练数据": "丹药"
  "算力 / GPU": "炉火"
  "模型架构": "功法"
  "能力突破": "悟道"
  "能力涌现": "涌现"
  "不懂技术的人": "凡人"
  "天赋不足": "伪灵根"
  "走弯路": "散修"

# 章节命名建议（留空表示不需要额外命名）
# ★ 经验：章节名用技术名，包装只放在标题修辞和过渡句里
chapter_naming: "technical"
